<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#4f6ef7" />
  <title>我的日程</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="日程" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="date-nav">
        <button type="button" class="icon-btn" id="btn-prev" aria-label="上一页">‹</button>
        <div class="date-title" id="date-title">加载中…</div>
        <button type="button" class="icon-btn" id="btn-next" aria-label="下一页">›</button>
        <button type="button" class="today-btn" id="btn-today">今天</button>
      </div>
      <div class="view-toggle" role="tablist" aria-label="视图切换">
        <button type="button" class="seg-btn active" data-view="timeGridWeek" role="tab" aria-selected="true">周视图</button>
        <button type="button" class="seg-btn" data-view="dayGridMonth" role="tab" aria-selected="false">月视图</button>
      </div>
    </header>

    <main class="cal-wrap">
      <div id="calendar"></div>
    </main>

    <!-- 底部待办抽屉：点按或上拉展开，列表项可拖到日历安排时间 -->
    <footer class="todo-tray" id="todo-tray">
      <div class="todo-drawer-bar" id="todo-drawer-bar">
        <div class="drawer-handle"></div>
        <div class="drawer-summary">
          <span class="drawer-title">待办清单</span>
          <span class="drawer-count" id="todo-count">0</span>
        </div>
        <span class="drawer-chevron" id="todo-toggle" role="button" tabindex="0"
              aria-label="展开或收起待办"></span>
      </div>
      <div class="todo-body">
        <div class="todo-input-row">
          <input id="todo-input" type="text" maxlength="60" autocomplete="off"
                 placeholder="添加待办，按住左侧把手拖到日历安排" />
          <button id="todo-add" type="button" aria-label="添加待办">＋</button>
        </div>
        <div class="todo-list" id="todo-list"></div>
        <button type="button" class="import-btn" id="btn-import-schedule">导入课表数据（换设备 / 换浏览器后点这里）</button>
      </div>
    </footer>

    <button type="button" class="fab" id="btn-add" aria-label="新建事项">＋</button>
  </div>

  <!-- 新建 / 查看编辑事项（底部弹层） -->
  <div class="overlay" id="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-heading">
      <div class="sheet-handle"></div>
      <h2 class="sheet-heading" id="sheet-heading">新建事项</h2>
      <form id="event-form" novalidate>
        <div class="field">
          <label for="f-title">标题</label>
          <input id="f-title" type="text" maxlength="60" autocomplete="off" placeholder="例如：团队周会" />
        </div>
        <div class="field">
          <label for="f-location">地点</label>
          <input id="f-location" type="text" maxlength="60" autocomplete="off" placeholder="选填" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-start">开始时间</label>
            <input id="f-start" type="datetime-local" />
            <div class="dt-hint" id="f-start-hint"></div>
          </div>
          <div class="field">
            <label for="f-end">结束时间</label>
            <input id="f-end" type="datetime-local" />
            <div class="dt-hint" id="f-end-hint"></div>
          </div>
        </div>
        <div class="field">
          <label for="f-repeat-mode">重复</label>
          <div class="repeat-row">
            <select id="f-repeat-mode">
              <option value="once">仅此一次</option>
              <option value="weekly">每周重复</option>
            </select>
            <span class="repeat-count" id="f-repeat-wrap" hidden>
              连续 <input id="f-repeat-count" type="number" min="1" max="52" value="2" /> 周
            </span>
          </div>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <div class="sheet-actions">
          <button type="button" class="btn btn-danger" id="btn-delete" hidden>删除</button>
          <span class="flex-spacer"></span>
          <button type="button" class="btn btn-ghost" id="btn-cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="btn-save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="lib/fullcalendar.global.min.js"></script>
  <script src="lib/fullcalendar.zh-cn.min.js"></script>
  <script src="lib/dexie.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
